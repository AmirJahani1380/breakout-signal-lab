<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breakout Research</title>
    <link rel="stylesheet" href="/static/style.css?v=2" />
  </head>
  <body>
    <main>
      <header>
        <h1>Breakout Research</h1>
        <p id="legend">Loading chart…</p>
      </header>
      <section class="selectors" aria-label="Dataset selection">
        <label for="data-mode">Chart mode</label>
        <select id="data-mode">
          <option value="source">Calculated</option>
          <option value="stored">Stored data</option>
        </select>
        <label for="symbol">Symbol</label>
        <select id="symbol" disabled>
          <option value="">Select a symbol</option>
        </select>
        <div id="timeframes" aria-label="Available timeframes"></div>
      </section>
      <section id="stored-import" aria-label="Import stored exports" hidden>
        <label for="stored-files"
          >Choose CSV or Parquet exports and matching JSON metadata</label
        >
        <input
          id="stored-files"
          type="file"
          accept=".csv,.parquet,.json"
          multiple
        />
        <p id="stored-import-status" role="status"></p>
        <ul id="stored-import-results"></ul>
      </section>
      <p id="dataset-version" role="status"></p>
      <section id="value-inspector" aria-label="Stored value inspector" hidden>
        <h2>Stored values</h2>
        <label for="inspect-time">Bar timestamp</label>
        <select id="inspect-time"></select>
        <div id="inspect-values"></div>
      </section>
      <nav class="chart-tabs" aria-label="Chart tools">
        <button
          id="indicators-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="indicators-panel"
        >
          Indicators
        </button>
        <button
          id="export-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="export-panel"
        >
          Export
        </button>
      </nav>
      <section
        id="indicators-panel"
        class="indicators-panel"
        role="tabpanel"
        aria-labelledby="indicators-tab"
        hidden
      ></section>
      <section
        id="export-panel"
        class="indicators-panel"
        role="tabpanel"
        aria-labelledby="export-tab"
        hidden
      >
        <p>Select feature columns to export for the entire selected dataset.</p>
        <div id="export-features"></div>
        <button id="export-csv" type="button">Download CSV</button>
        <button id="export-parquet" type="button">Download Parquet</button>
        <p id="export-status" role="status"></p>
      </section>
      <section id="chart" aria-label="Candlestick chart"></section>
      <p id="state" role="status">Loading chart…</p>
      <p class="attribution">
        Charts by
        <a href="https://www.tradingview.com/" target="_blank" rel="noreferrer"
          >TradingView Lightweight Charts™</a
        >
      </p>
    </main>
    <script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
