[project]
name = "breakout-research-chart-viewer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "openpyxl>=3.1,<4",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[tool.setuptools]
packages = ["app", "app.indicators"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
  "playwright>=1.47,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["openpyxl"]
ignore_missing_imports = true
