[project]
name = "breakout-research-chart-viewer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[tool.setuptools]
packages = ["app", "app.features", "app.event_detectors"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "numpy<2.5", # NumPy 2.5 stubs require Python 3.12 syntax; mypy targets Python 3.11.
  "pandas-stubs>=2.2,<3",
  "ruff>=0.6,<1",
  "playwright>=1.47,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.pylint.messages_control]
disable = [
  "disallowed-name",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "protected-access",
  "redefined-outer-name",
  "unused-argument",
]

[[tool.mypy.overrides]]
module = ["openpyxl", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
